name: Publish Windows update

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: snowyy-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Verify tag matches package version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$packageVersion") {
            throw "Release tag $env:RELEASE_TAG does not match package version v$packageVersion."
          }

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build and publish the update
        run: npm run publish:github
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SNOWYY_GITHUB_DRAFT: '0'
